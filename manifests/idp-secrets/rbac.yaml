# The chart's templates/idp-secrets.yaml with its default values. Provider admins create each
# Secret (key client-secret) here by hand.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-grid-idp-secrets
  labels:
    app.kubernetes.io/component: idp-secrets
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-grid-provider-console-idp-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-grid-provider-console-idp-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-grid-provider-console-idp-secrets
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid
