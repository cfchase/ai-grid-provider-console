# Values for the AI Grid provider console. One release per ACM hub: the names below are fixed (other
# tooling, such as ai-grid-env-setup, refers to them), and some objects are cluster-scoped.
# values.schema.json lists every key: one it doesn't know, such as a misspelled --set, fails the
# install instead of being ignored. Add a new key there too.

# Name of every object, and of the ServiceAccount the backend acts as.
fullnameOverride: ai-grid-provider-console

# Each image is repository:tag, repository@digest, or repository:tag@digest when both are set.
# Pin a digest in production: tags can be overwritten.
images:
  authProxy:
    repository: quay.io/opendatahub/odh-kube-auth-proxy
    tag: latest
    digest: ""
  # A chart can't name the build of its own commit, so the console stays latest here; set its tag
  # or digest when you install (README.md, "Images").
  console:
    repository: ghcr.io/ai-grid-cloud/ai-grid-provider-console
    tag: latest
    digest: ""
  # The build of the backend commit the console is generated from (.backend-api-version): a newer
  # backend can refuse what this console sends. Set by `make backend-pin` from
  # `.backend-api-version`; don't edit by hand.
  backend:
    repository: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
    tag: sha-57b2fbac336777bb06ba562c826e4e0a0a516f0e
    digest: sha256:a1f6086f00ccaa157026a9559df4f63bd1a9f11e1014581eda690619fe43a371
imagePullPolicy: ""  # empty: the cluster default
imagePullSecrets: []

# Sign-in through OpenShift OAuth (kube-auth-proxy). The chart does not create the OAuthClient or
# this Secret: hack/deploy.sh does, or ai-grid-env-setup's bootstrap/60-console.sh. A chart cannot
# keep generated secrets stable under `helm template` or Argo CD. The Secret holds
# OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET (16, 24 or 32
# bytes) and OAUTH2_PROXY_REDIRECT_URL.
oauth:
  secretName: ""  # default: <fullname>-oauth
  cookieName: _ai_grid_console

# The proxy's HTTPS certificate. With serviceCA, OpenShift's service CA issues it into secretName;
# otherwise secretName must already hold tls.crt and tls.key.
tls:
  serviceCA: true
  secretName: ""  # default: <fullname>-tls

route:
  # A reencrypt Route to the proxy (OpenShift).
  enabled: true
  # Empty lets the router assign <name>-<namespace>.<apps domain>.
  host: ""
  # PEM CA the router trusts for the proxy's certificate. Not needed with tls.serviceCA: the
  # router trusts the service CA. Set it when tls.secretName holds a certificate from another CA.
  destinationCACertificate: ""
  # How long the router waits for the console's answer (haproxy.router.openshift.io/timeout;
  # OpenShift's default is 30s). Longer than kube-auth-proxy's upstreamTimeout below, which is longer
  # than the BFF's longest answer (its 60s server write timeout, BACKEND_WRITE_TIMEOUT at most 50s):
  # a slow model or subscription write then ends in the BFF's own answer, not the router's 504.
  timeout: 70s

# The console container (BFF and frontend).
console:
  # GET /api/v1/config.
  gridConsumerUrl: ""
  mapTileUrl: ""
  # The attribution the tile server requires, shown with mapTileUrl's tiles.
  mapTileAttribution: ""
  billingUrl: ""
  logLevel: info
  # The Monitoring page's Perses (docs/plan/bff-api.md, "The Perses relay"): its dashboard-*
  # dashboards are the page's tabs. Empty url: Monitoring keeps its page without Perses.
  perses:
    # The hub's Perses server, such as the Cluster Observability Operator's:
    # https://perses.openshift-cluster-observability-operator.svc:8080
    url: ""
    # The one Perses project Monitoring reads (with the global datasources). Its PersesDashboards
    # whose names start with dashboard- (such as dashboard-usage) are the tabs; any other dashboard
    # in it is ignored. Required with url: the rendering fails without it. Perses sends the
    # signed-in admin's hub token on to the datasources it queries, so only provider admins may
    # create or edit this project's PersesDashboards and PersesDatasources and the
    # PersesGlobalDatasources, and the global datasources must point only at the hub's own Thanos
    # and Loki.
    project: ""
    # The CA that verifies the server's certificate. The default is OpenShift's service CA, which
    # every pod gets next to its ServiceAccount token and which issues the Cluster Observability
    # Operator's Perses certificate. Empty: the system roots.
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  # The Deploy model wizard (README.md, "Model hardware").
  models:
    # The wizard's Hardware choices, the first one selected. Selecting one fills in the model's
    # resources and runtime image, and adds its environment variables. These two are the console's
    # defaults: a hub's GitOps repository overrides the list in its values, and a list replaces this
    # one whole, so repeat the entries you keep. The BFF holds the same two for a run without
    # MODEL_HARDWARE (make dev), and hack/check-chart.sh keeps them equal. Each entry:
    #   id           a DNS label, unique in the list
    #   label        what the wizard shows, in sentence case
    #   description  optional, one sentence
    #   accelerator  optional: the Kubernetes extended resource requested per accelerator, such as
    #                nvidia.com/gpu or amd.com/gpu; none means CPU only
    #   image        optional: the runtime image, with no spaces. None leaves the wizard's field empty:
    #                for nvidia.com/gpu that runs the cluster's default vLLM image, which is for
    #                NVIDIA GPUs; for any other hardware the user must enter one
    #   env          optional: environment variables for the model's container, as name: value;
    #                not VLLM_ADDITIONAL_ARGS, which the wizard's runtime arguments set
    #   defaults     optional: the resources the wizard starts from: accelerators (1 to 64, only
    #                with an accelerator), cpu (cores or millicores, such as 2 or 500m) and memory
    #                (whole Mi, Gi or Ti, such as 16Gi)
    hardware:
      # No image: the cluster's default vLLM image, which is for NVIDIA GPUs.
      - id: nvidia-gpu
        label: NVIDIA GPU
        description: For clusters with NVIDIA GPUs.
        accelerator: nvidia.com/gpu
        defaults: { accelerators: 1, cpu: "2", memory: 16Gi }
      # OpenShift AI 3.6's CPU preset (red-hat-data-services/kserve rhoai-3.6 at 71b7da3:
      # config/overlays/odh/accelerators/cpu-config-llm-template.yaml, and the kserve-llm-d-cpu
      # image of config/overlays/odh/params.env), without its node selector
      # kubernetes.io/arch: amd64, which a model can't set.
      - id: cpu
        label: CPU only
        description: For x86_64 clusters without GPUs.
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9
        env: { OMP_NUM_THREADS: "4", VLLM_CPU_KVCACHE_SPACE: "4" }
        defaults: { cpu: "4", memory: 8Gi }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

backend:
  # Secret with the backend's Keycloak settings: keys url, realm, admin-realm, username, password.
  # Created by hack/deploy.sh or bootstrap/60-console.sh. The container does not start without it,
  # which keeps the backend off its built-in default credentials.
  keycloakSecretName: ai-grid-backend-keycloak
  # Let the backend patch ManagedClusters (Add to AI Grid, Edit and Remove in the console). This
  # installs a ValidatingAdmissionPolicy that limits the backend's writes to the ai-grid/* and
  # location labels and the ai-grid/* annotations. Off: the backend only reads clusters.
  clusterWrites: false
  # Organization identity providers: an organization's provider names the Secret that holds its
  # OIDC client secret (config.client_secret_secret_name, key client-secret), which a provider admin
  # creates by hand in this namespace before creating the organization. The backend reads the
  # namespace from AI_GRID_IDP_SECRET_NAMESPACE (ai-grid-provider-backend
  # cmd/ai-grid-provider-backend/main.go) and gets those Secrets by name; it can't list, watch or
  # write them, there or anywhere else. Off: no namespace and no Role, so creating an
  # organization with an identity provider fails unless the backend's default namespace and a
  # get Role exist some other way.
  idpSecrets:
    enabled: true
    # Sets the backend's AI_GRID_IDP_SECRET_NAMESPACE. The backend can get every Secret in this
    # namespace, so keep only IdP client secrets in it. It can't be the release namespace or a
    # system one (default, kube-*, openshift*): the render fails.
    namespace: ai-grid-idp-secrets
    # Create the namespace. Helm keeps it on uninstall (helm.sh/resource-policy: keep), so the
    # Secrets in it survive. Set false when the namespace already exists or something else owns it.
    createNamespace: true
  # Git mode (ai-grid-provider-backend#29): the backend commits Models and Subscriptions to this
  # repository, and Argo CD delivers them to the spokes. Backend images with git mode do not start
  # without git.url. Empty url: no git settings, for backend images from before git mode.
  git:
    # https://, without credentials, e.g. https://github.com/ai-grid-cloud/demo-cluster.git.
    url: ""
    branch: main
    # Secret with key token: a fine-grained token with contents: write on that repository only,
    # mounted as a file. Created by hack/deploy.sh (GIT_TOKEN) or by hand on the hub, not by the
    # chart.
    tokenSecretName: ai-grid-backend-git
    # The spokes' grid namespace, which each model's NetworkPolicy admits. Empty: the backend's
    # default (redhat-ai-grid).
    gridNamespace: ""
    # The spokes' namespace each model is deployed to. Empty: the backend's default. The reference
    # environment and our clusters use ai-grid-internal-models. It must match the environment's
    # model namespace: the environment delivers models to that namespace, creates it enabled for
    # the grid, and reads model status from it, so setting only this value commits models that are
    # never delivered, routed or reported. Changing it on a live install moves each model to the
    # new namespace on its next write, and Argo CD prunes the old copy; models nobody edits stay
    # in the old namespace, so the spokes serve from both until each model is written again.
    modelsNamespace: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

authProxy:
  # How long kube-auth-proxy waits for the BFF's answer (--upstream-timeout; its default is 30s, as
  # long as BACKEND_WRITE_TIMEOUT's default). Longer than the BFF's 60s server write timeout, shorter
  # than route.timeout.
  upstreamTimeout: 65s
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
