# Values for the AI Grid provider console. One release per ACM hub: the names below are fixed (other
# tooling, such as ai-grid-env-setup, refers to them), and some objects are cluster-scoped.
# values.schema.json lists every key: one it doesn't know, such as a misspelled --set, fails the
# install instead of being ignored. Add a new key there too.

# Name of every object, and of the ServiceAccount the backend acts as.
fullnameOverride: ai-grid-provider-console

# Each image is repository:tag, repository@digest, or repository:tag@digest when both are set.
# Pin a digest in production: tags can be overwritten.
images:
  authProxy:
    repository: quay.io/opendatahub/odh-kube-auth-proxy
    tag: latest
    digest: ""
  # A chart can't name the build of its own commit, so the console stays latest here; set its tag
  # or digest when you install (README.md, "Images").
  console:
    repository: ghcr.io/ai-grid-cloud/ai-grid-provider-console
    tag: latest
    digest: ""
  # The build of the backend commit the console is generated from (.backend-api-version): a newer
  # backend can refuse what this console sends. Set by `make backend-pin` from
  # `.backend-api-version`; don't edit by hand.
  backend:
    repository: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
    tag: sha-1141af02f5e0eee062b1c18da7f3e579a82d062c
    digest: sha256:04e53a5a5f8ae8d75e9cb7b16117227d23aa77b1814524e682fb7817c3578559
imagePullPolicy: ""  # empty: the cluster default
imagePullSecrets: []

# Sign-in through OpenShift OAuth (kube-auth-proxy). The chart does not create the OAuthClient or
# this Secret: hack/deploy.sh does, or ai-grid-env-setup's bootstrap/60-console.sh. A chart cannot
# keep generated secrets stable under `helm template` or Argo CD. The Secret holds
# OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET (16, 24 or 32
# bytes) and OAUTH2_PROXY_REDIRECT_URL.
oauth:
  secretName: ""  # default: <fullname>-oauth
  cookieName: _ai_grid_console

# The proxy's HTTPS certificate. With serviceCA, OpenShift's service CA issues it into secretName;
# otherwise secretName must already hold tls.crt and tls.key.
tls:
  serviceCA: true
  secretName: ""  # default: <fullname>-tls

route:
  # A reencrypt Route to the proxy (OpenShift).
  enabled: true
  # Empty lets the router assign <name>-<namespace>.<apps domain>.
  host: ""
  # PEM CA the router trusts for the proxy's certificate. Not needed with tls.serviceCA: the
  # router trusts the service CA. Set it when tls.secretName holds a certificate from another CA.
  destinationCACertificate: ""

# The console container (BFF and frontend).
console:
  # GET /api/v1/config.
  gridConsumerUrl: ""
  mapTileUrl: ""
  # The attribution the tile server requires, shown with mapTileUrl's tiles.
  mapTileAttribution: ""
  billingUrl: ""
  logLevel: info
  # The Monitoring page's Perses (docs/plan/bff-api.md, "The Perses relay"): its dashboard-*
  # dashboards are the page's tabs. Empty url: Monitoring keeps its page without Perses.
  perses:
    # The hub's Perses server, such as the Cluster Observability Operator's:
    # https://perses.openshift-cluster-observability-operator.svc:8080
    url: ""
    # The one Perses project Monitoring reads (with the global datasources). Its PersesDashboards
    # whose names start with dashboard- (such as dashboard-usage) are the tabs; any other dashboard
    # in it is ignored. Required with url: the rendering fails without it. Perses sends the
    # signed-in admin's hub token on to the datasources it queries, so only provider admins may
    # create or edit this project's PersesDashboards and PersesDatasources and the
    # PersesGlobalDatasources, and the global datasources must point only at the hub's own Thanos
    # and Loki.
    project: ""
    # The CA that verifies the server's certificate. The default is OpenShift's service CA, which
    # every pod gets next to its ServiceAccount token and which issues the Cluster Observability
    # Operator's Perses certificate. Empty: the system roots.
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

backend:
  # Secret with the backend's Keycloak settings: keys url, realm, admin-realm, username, password.
  # Created by hack/deploy.sh or bootstrap/60-console.sh. The container does not start without it,
  # which keeps the backend off its built-in default credentials.
  keycloakSecretName: ai-grid-backend-keycloak
  # Let the backend patch ManagedClusters (Add to AI Grid and Remove in the console). This also
  # installs a ValidatingAdmissionPolicy that limits the backend's writes to the ai-grid/* and
  # location labels and the ai-grid/* annotations. Off: the backend only reads clusters.
  clusterWrites: false
  # Git mode (ai-grid-provider-backend#29): the backend commits Models and Subscriptions to this
  # repository, and Argo CD delivers them to the spokes. Backend images with git mode do not start
  # without git.url. Empty url: no git settings, for backend images from before git mode.
  git:
    # https://, without credentials, e.g. https://github.com/ai-grid-cloud/demo-cluster.git.
    url: ""
    branch: main
    # Secret with key token: a fine-grained token with contents: write on that repository only,
    # mounted as a file. Created by hack/deploy.sh (GIT_TOKEN) or by hand on the hub, not by the
    # chart.
    tokenSecretName: ai-grid-backend-git
    # The spokes' grid namespace, which each model's NetworkPolicy admits. Empty: the backend's
    # default (redhat-ai-grid).
    gridNamespace: ""
    # The spokes' namespace each model is deployed to. Empty: the backend's default. The reference
    # environment and our clusters use ai-grid-internal-models. It must match the environment's
    # model namespace: the environment delivers models to that namespace, creates it enabled for
    # the grid, and reads model status from it, so setting only this value commits models that are
    # never delivered, routed or reported. Changing it on a live install moves each model to the
    # new namespace on its next write, and Argo CD prunes the old copy; models nobody edits stay
    # in the old namespace, so the spokes serve from both until each model is written again.
    modelsNamespace: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The model servers and hardware profiles the Deploy model wizard offers, and the backend checks a
# model against (Models/ListServingOptions). One list for every cluster, rendered into a ConfigMap
# the backend mounts; the backend doesn't read the clusters. Override any part to offer your own,
# such as a GPU HardwareProfile you created on the clusters. The defaults are what OpenShift AI 3.6
# installs:
#   - modelServers: every supported accelerator preset (LLMInferenceServiceConfig labelled
#     opendatahub.io/config-type=accelerator in the OpenShift AI namespace), from
#     red-hat-data-services/kserve rhoai-3.6 at 71b7da36a3f8, config/overlays/odh/accelerators/.
#     The unsupported "-fast-N" previews (opendatahub.io/support-status: unsupported) are left out.
#     The three NVIDIA prefill/decode and multi-node presets add prefill or worker pods that need a
#     topology (prefill replicas, parallelism) the wizard doesn't set: it gives only the main
#     container its resources, so those pods get no GPUs. Their descriptions say so.
#   - hardwareProfiles: default-profile, which the DSCInitialization creates
#     (opendatahub-operator internal/controller/dscinitialization/hardwareprofile.go).
# Checked on demo1's spokes (site-a and site-b, one NVIDIA GPU each) on 2026-11-02: both have the
# CPU and the four NVIDIA presets and default-profile. A cluster without GPUs has only the CPU one.
# Two limits:
#   - OpenShift AI installs on each cluster only the presets its nodes can run (kserve-module
#     hardware_filter.go): CPU everywhere, a GPU preset only where nodes have that accelerator. A
#     model placed on a cluster without its preset fails there, and its status says so.
#   - Preset names carry the OpenShift AI release (v3-6-0-...). After an OpenShift AI upgrade, list
#     the presets on the clusters (oc get llminferenceserviceconfigs -n redhat-ods-applications
#     -l opendatahub.io/config-type=accelerator) and set openshiftAIRelease to the new release. A
#     preset the upgrade didn't change keeps its older name (kserve-module differential
#     versioning): give that server its own release. Models keep the preset they were made with.
servingOptions:
  # The OpenShift AI release on the clusters. Each model server's name is prefixed with it, as
  # OpenShift AI names its presets: 3.6.0 gives v3-6-0-<name>.
  openshiftAIRelease: "3.6.0"
  # name: the preset's name without the release prefix. release: optional, the release in this
  # preset's name when it differs from openshiftAIRelease. accelerators: the node resources it
  # needs (its opendatahub.io/recommended-accelerators); empty runs on CPUs.
  modelServers:
    - name: kserve-config-llm-template-cpu
      displayName: vLLM CPU
      description: vLLM on x86_64 CPU-only nodes.
      accelerators: []
    - name: kserve-config-llm-single-node-template-nvidia-cuda
      displayName: vLLM NVIDIA GPU
      description: vLLM with NVIDIA CUDA GPUs, on one node.
      accelerators: [nvidia.com/gpu]
    - name: kserve-config-llm-template-amd-rocm
      displayName: vLLM AMD GPU
      description: vLLM with AMD ROCm GPUs.
      accelerators: [amd.com/gpu]
    - name: kserve-config-llm-template-intel-gaudi
      displayName: vLLM Intel Gaudi
      description: vLLM with Intel Gaudi accelerators.
      accelerators: [habana.ai/gaudi]
    - name: kserve-config-llm-template-ibm-spyre-x86
      displayName: vLLM IBM Spyre, x86
      description: vLLM with IBM Spyre accelerators on x86 nodes.
      accelerators: [ibm.com/spyre_pf]
    - name: kserve-config-llm-template-ibm-spyre-ppc64le
      displayName: vLLM IBM Spyre, Power
      description: vLLM with IBM Spyre accelerators on ppc64le nodes.
      accelerators: [ibm.com/spyre_pf]
    - name: kserve-config-llm-template-ibm-spyre-s390x
      displayName: vLLM IBM Spyre, IBM Z
      description: vLLM with IBM Spyre accelerators on s390x nodes.
      accelerators: [ibm.com/spyre_vf]
    # These three need a topology the wizard doesn't set (see above).
    - name: kserve-config-llm-single-node-pd-template-nvidia-cuda
      displayName: vLLM NVIDIA GPU, prefill/decode
      description: >-
        vLLM with NVIDIA CUDA GPUs, on one node, with prefill and decode split. The wizard sets
        only the decode pod's resources, so the prefill pods get no GPUs.
      accelerators: [nvidia.com/gpu]
    - name: kserve-config-llm-multi-node-template-nvidia-cuda
      displayName: vLLM NVIDIA GPU, multi-node
      description: >-
        vLLM with NVIDIA CUDA GPUs, data parallel across nodes. The wizard sets only the main
        pod's resources and no parallelism, so the worker pods get no GPUs.
      accelerators: [nvidia.com/gpu]
    - name: kserve-config-llm-multi-node-pd-template-nvidia-cuda
      displayName: vLLM NVIDIA GPU, multi-node prefill/decode
      description: >-
        vLLM with NVIDIA CUDA GPUs, across nodes, with prefill and decode split. The wizard sets
        only the main pod's resources and no parallelism, so the other pods get no GPUs.
      accelerators: [nvidia.com/gpu]
  # A model names a profile by name, so names must be unique. resources: the profile's
  # spec.identifiers, which tell the wizard whether it gives the model GPUs.
  hardwareProfiles:
    - name: default-profile
      namespace: redhat-ods-applications
      displayName: Default profile
      description: 2 CPUs and 4 GiB of memory.
      resources: [cpu, memory]

authProxy:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
