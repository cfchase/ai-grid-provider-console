apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  # One pod: the console holds no state, and one per hub is the supported topology.
  replicas: 1
  # Recreate, so a Deployment rollout never runs two pods at once: the backend serializes each
  # organization's writes with in-process locks, which hold only with one backend
  # (ai-grid-cloud/ai-grid-provider-backend#16). An upgrade stops the console until the new pod is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # The selector labels only: a chart or version label here would restart the pod on every
      # chart release.
      labels:
        {{- include "console.selectorLabels" . | nindent 8 }}
      annotations:
        # The backend reads the serving options once at start: a changed list restarts the pod.
        checksum/serving-options: {{ include "console.servingOptions" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Login: OpenShift OAuth via kube-auth-proxy, the proxy RHOAI uses.
        # Flags follow the opendatahub-operator gateway template. The proxy
        # forwards the user's access token and name to the BFF in
        # X-Forwarded-Access-Token and X-Forwarded-User.
        - name: kube-auth-proxy
          image: {{ include "console.image" .Values.images.authProxy }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            - --provider=openshift
            - --https-address=0.0.0.0:8443
            - --http-address=127.0.0.1:4180
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-key-file=/etc/tls/private/tls.key
            - --upstream=http://127.0.0.1:8080/
            - --redirect-url=$(OAUTH2_PROXY_REDIRECT_URL)
            - --email-domain=*
            - --scope=user:full
            - --skip-provider-button
            - --pass-access-token=true
            - --pass-user-headers=true
            - --set-xauthrequest=true
            # Drop the X-Forwarded-* identity headers (user, email, groups, preferred
            # username, access token) a client sends before setting its own: the BFF
            # trusts them. The proxy's default, stated so that a change of default can't
            # let a caller name itself; hack/test-chart-kind.sh sends forged ones.
            # (--set-xauthrequest sets X-Auth-Request-* on responses, not requests.)
            - --skip-auth-strip-headers=true
            - --skip-jwt-bearer-tokens=true
            - --enable-k8s-token-validation=true
            - --use-system-trust-store=true
            - --cookie-name={{ required "oauth.cookieName is required" .Values.oauth.cookieName }}
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --cookie-refresh=1h
            # The BFF listens on loopback, so the kubelet probes it through
            # the proxy. /readyz carries no user data and needs no login.
            - --skip-auth-route=^/readyz$
            # The browser's Connect calls to the backend (the BFF relays /ai_grid.v1.*): a call
            # without a valid session is 401, which the Connect client reads as Unauthenticated,
            # not a redirect to the login page, which fetch can't follow.
            - --api-route=^/ai_grid\.v1\.
          env:
            # Created by hack/deploy.sh together with the OAuthClient.
            {{- $oauth := include "console.oauthSecretName" . }}
            {{- range list "OAUTH2_PROXY_CLIENT_ID" "OAUTH2_PROXY_CLIENT_SECRET" "OAUTH2_PROXY_COOKIE_SECRET" "OAUTH2_PROXY_REDIRECT_URL" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $oauth }}
                  key: {{ . }}
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # The console: a thin BFF plus the built frontend. It translates the
        # frontend's JSON calls into gRPC on the backend container over
        # loopback and forwards the caller's identity in request metadata.
        # It binds to loopback so that nothing on the pod network can reach
        # it with forged identity headers: every request comes through the
        # proxy. The only hub call it makes is a SelfSubjectAccessReview with
        # the caller's token (isProviderAdmin), using the in-cluster API
        # address and CA that every pod gets.
        - name: bff
          image: {{ include "console.image" .Values.images.console }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            - --bind-address=127.0.0.1
            - --port=8080
            - --static-assets-dir=/static
            - --backend-address=127.0.0.1:9090
          env:
            - name: GRID_CONSUMER_URL
              value: {{ .Values.console.gridConsumerUrl | quote }}
            - name: MAP_TILE_URL
              value: {{ .Values.console.mapTileUrl | quote }}
            - name: MAP_TILE_ATTRIBUTION
              value: {{ .Values.console.mapTileAttribution | quote }}
            - name: BILLING_URL
              value: {{ .Values.console.billingUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.console.logLevel | quote }}
            {{- with .Values.console.perses }}
            {{- if .url }}
            # The Monitoring page: the BFF relays /perses/api to this Perses with the caller's token.
            - name: PERSES_URL
              value: {{ .url | quote }}
            # Required: Perses sends the caller's token on to the datasources it queries, so the relay
            # reads one project, whose dashboards and datasources only provider admins may write.
            - name: PERSES_PROJECT
              value: {{ required "console.perses.project must be set with console.perses.url: the one Perses project Monitoring reads, whose dashboards and datasources only provider admins may write" .project | quote }}
            {{- with .caFile }}
            - name: PERSES_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          # Probed through the proxy (same pod, port 8443): the kubelet cannot
          # reach a loopback port. /readyz also pings the backend, so this one
          # probe gates traffic for all three containers. No liveness probe:
          # it would restart the BFF whenever the proxy is down.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            periodSeconds: 5
            # /readyz waits up to 3s for the backend's Ping; leave room for it
            # plus the hop through the proxy, or a slow ping flaps readiness.
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        # ai-grid-backend: owns every call to the hub API, Keycloak and
        # metrics using the pod's ServiceAccount. Its gRPC port and its REST
        # gateway (with Swagger UI, unauthenticated, on every interface by
        # default) bind to loopback, so only the BFF can reach the backend;
        # nothing on the pod network can. The kubelet therefore cannot probe
        # it directly: the BFF's /readyz pings it and takes the pod out of the
        # Service when it does not answer.
        - name: ai-grid-backend
          image: {{ include "console.image" .Values.images.backend }}
          {{- with .Values.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            - --listen-address=127.0.0.1:9090
            - --http-listen-address=127.0.0.1:8081
          env:
            # Keycloak settings and credentials all come from one secret that
            # hack/deploy.sh creates from KEYCLOAK_URL, KEYCLOAK_REALM,
            # KEYCLOAK_ADMIN_REALM, KEYCLOAK_ADMIN_USERNAME and
            # KEYCLOAK_ADMIN_PASSWORD, so the chart carries no values of any
            # one environment. Every key is required: without the secret the
            # container does not start, which is the point, because the
            # backend would otherwise fall back to its built-in admin/admin.
            {{- $kc := include "console.keycloakSecretName" . }}
            {{- range list (list "KEYCLOAK_URL" "url") (list "KEYCLOAK_ADMIN_REALM" "admin-realm") (list "KEYCLOAK_REALM" "realm") (list "KEYCLOAK_ADMIN_USERNAME" "username") (list "KEYCLOAK_ADMIN_PASSWORD" "password") }}
            - name: {{ index . 0 }}
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}
                  key: {{ index . 1 }}
            {{- end }}
            # The model servers and hardware profiles the wizard offers (values servingOptions).
            - name: AI_GRID_SERVING_OPTIONS_FILE
              value: /etc/ai-grid/serving-options/serving-options.yaml
            {{- with .Values.backend.git }}
            {{- if .url }}
            # Git mode: Models and Subscriptions are commits to this repository, which Argo CD
            # delivers to the spokes. The token is a mounted file, never an environment variable,
            # so it stays out of the pod spec and the backend's logs.
            - name: AI_GRID_GIT_URL
              value: {{ .url | quote }}
            - name: AI_GRID_GIT_BRANCH
              value: {{ .branch | quote }}
            - name: AI_GRID_GIT_TOKEN_FILE
              value: /var/run/secrets/ai-grid-git/token
            {{- with .gridNamespace }}
            - name: AI_GRID_GRID_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .modelsNamespace }}
            - name: AI_GRID_MODELS_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: serving-options
              mountPath: /etc/ai-grid/serving-options
              readOnly: true
            {{- if .Values.backend.git.url }}
            - name: git-token
              mountPath: /var/run/secrets/ai-grid-git
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            secretName: {{ include "console.tlsSecretName" . }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: serving-options
          configMap:
            name: {{ include "console.fullname" . }}-serving-options
        {{- if .Values.backend.git.url }}
        # Required: in git mode the backend can't push without the token, so the pod waits for the
        # Secret instead of starting a backend that fails every write.
        - name: git-token
          secret:
            secretName: {{ .Values.backend.git.tokenSecretName }}
            items:
              - key: token
                path: token
        {{- end }}
